name: CI/CD Symfony
on: [pull_request]

jobs:
  build:
    name: 🔨 Build de l'application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, xml, zip, intl, sqlite3
          ini-values: memory_limit=512M
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Configure environment
        run: |
          cp .env .env.local
          echo "DATABASE_URL=sqlite:///%kernel.project_dir%/var/data.db" >> .env.local
          echo "APP_ENV=test" >> .env.local
          echo "APP_SECRET=UnSecretFixePourLaCITestNePasUtiliserEnProduction" >> .env.local
          mkdir -p var
          touch var/data.db

      - name: Install dependencies
        run: |
          export COMPOSER_MEMORY_LIMIT=-1
          composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Setup Symfony
        run: |
          php bin/console about
          php bin/console doctrine:database:create --env=test --if-not-exists || true
          php bin/console doctrine:migrations:migrate --no-interaction --env=test || true
          echo "✅ L'application Symfony a été construite avec succès"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            vendor/
            .env.local

  code-quality:
    name: 🔍 Vérifications qualité code
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        check: [twig-cs, php-cs, phpcs, phpstan ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, xml, zip, intl, sqlite3
          ini-values: memory_limit=512M
          coverage: none

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Fix permissions for vendor binaries
        run: |
          chmod +x vendor/bin/*

      - name: 🔍 Vérification du style avec TWIG-CS-Fixer
        if: matrix.check == 'twig-cs'
        run: |
          vendor/bin/twig-cs-fixer lint ./templates/

      - name: 🔍 Vérification du style avec PHP-CS-Fixer
        if: matrix.check == 'php-cs'
        run: |
          vendor/bin/php-cs-fixer fix --dry-run

      - name: 🔍 Vérification des standards de codage avec PHPCS
        if: matrix.check == 'phpcs'
        run: |
          vendor/bin/phpcs --standard=phpcs.xml ./

      - name: 🔍 Analyse statique avec PHPStan
        if: matrix.check == 'phpstan'
        run: |
          vendor/bin/phpstan analyse

  review:
    name: 🤖 Gemini PR Review
    runs-on: ubuntu-latest
    needs: code-quality
    if: ${{ needs.code-quality.result == 'success' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history
      - name: Get PR diff
        id: get_diff
        shell: bash
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git fetch origin ${{ github.event.pull_request.head.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }} HEAD > diff.txt
          {
            echo "pull_request_diff<<EOF"
            cat diff.txt
            echo EOF
          } >> $GITHUB_OUTPUT
      - uses: rubensflinco/gemini-code-review-action@1.0.5
        name: Code Review by Gemini AI
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repository: ${{ github.repository }}
          github_pull_request_number: ${{ github.event.pull_request.number }}
          git_commit_hash: ${{ github.event.pull_request.head.sha }}
          model: "gemini-2.5-flash"
          pull_request_diff: ${{ steps.get_diff.outputs.pull_request_diff }}
          extra_prompt: |
            Expert Symfony/PHP/Docker. Structure ta review :
            - **Problèmes** : sécurité, perf, bugs.
            - **Suggestions fixes** : ```diff ancien -> nouveau```
            - **Améliorations** optionnelles.
            Français précis.
